<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Traicr — Mobile: child transcript as a full-screen sheet over the parent</title>
  <desc id="desc">On narrow screens a delegated-work entry opens as a sheet that covers the parent transcript but leaves a dimmed sliver of it visible at the top. The header names the parent as the back target and pages between sibling agents. All transcript text is synthetic.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #202b26; }
    .mono { font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .muted { fill: #606d65; }
    .green { fill: #25583e; }
    .white { fill: #ffffff; }
    .it { font-style: italic; }
    .w5 { font-weight: 500; }
    .w6 { font-weight: 600; }
    .w7 { font-weight: 700; }
    .card { fill: #ffffff; stroke: #dce2d9; }
    .soft { fill: #eaf0e7; }
    .hairline { stroke: #dce2d9; }
  </style>
  <defs>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="10" flood-color="#101a14" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ============ parent transcript underneath (dimmed) ============ -->
  <rect width="390" height="844" fill="#f7f8f4"/>
  <rect x="20" y="52" width="22" height="22" rx="4" fill="#25583e"/>
  <text x="31" y="68" font-size="14" text-anchor="middle" class="white" font-family="Georgia, serif" font-weight="700">t</text>
  <text x="50" y="68" font-size="14" class="w7" letter-spacing="-0.4">traicr</text>
  <text x="370" y="68" font-size="11" text-anchor="end" class="green">← Transcripts</text>
  <text x="20" y="104" font-size="16" font-weight="650" letter-spacing="-0.3">Add CSV export to billing reports</text>
  <text x="20" y="124" font-size="9" class="mono muted">pi · cwd ~/code/lumen · 42 events</text>

  <!-- scrim over the parent -->
  <rect width="390" height="844" fill="#1c2420" opacity="0.38"/>

  <!-- status bar (over the scrim) -->
  <text x="28" y="32" font-size="13" class="white w6">9:41</text>
  <g fill="#ffffff" opacity="0.95">
    <rect x="312" y="25" width="3" height="7" rx="1"/>
    <rect x="317" y="22" width="3" height="10" rx="1"/>
    <rect x="322" y="19" width="3" height="13" rx="1"/>
    <rect x="336" y="21" width="22" height="11" rx="3" fill="none" stroke="#ffffff"/>
    <rect x="338.5" y="23.5" width="14" height="6" rx="1.5"/>
    <rect x="359" y="24" width="2" height="5" rx="1"/>
  </g>

  <!-- ============ child sheet ============ -->
  <rect x="0" y="76" width="390" height="768" rx="16" fill="#f7f8f4" filter="url(#sheetShadow)"/>
  <rect x="0" y="812" width="390" height="32" fill="#f7f8f4"/>
  <rect x="177" y="86" width="36" height="4" rx="2" fill="#cfd6cc"/>

  <!-- back to parent -->
  <text x="20" y="122" font-size="13" class="green w6">‹ Add CSV export to billing reports</text>

  <!-- eyebrow + sibling pager -->
  <text x="20" y="152" font-size="9" letter-spacing="1.2" class="mono green w6">DELEGATED WORK</text>
  <rect x="294" y="136" width="22" height="22" rx="5" fill="#ffffff" stroke="#dce2d9"/>
  <text x="305" y="151" font-size="12" text-anchor="middle" class="green">‹</text>
  <text x="332" y="151" font-size="9.5" text-anchor="middle" class="mono muted">2 / 3</text>
  <rect x="348" y="136" width="22" height="22" rx="5" fill="#ffffff" stroke="#dce2d9"/>
  <text x="359" y="151" font-size="12" text-anchor="middle" class="green">›</text>

  <!-- child title + meta -->
  <text x="20" y="182" font-size="18" font-weight="650" letter-spacing="-0.3">API docs for export endpoint</text>
  <text x="20" y="204" font-size="9.5" class="mono muted">claude · ~/code/lumen · ✓ finished · 1m 40s</text>
  <line x1="20" y1="220.5" x2="370" y2="220.5" class="hairline"/>

  <!-- delegation prompt -->
  <rect x="20" y="236" width="350" height="94" rx="10" class="soft"/>
  <text x="34" y="256" font-size="9" class="mono muted">14:24 · delegation prompt from parent</text>
  <text x="34" y="277" font-size="12.5">Document the new /billing/export.csv</text>
  <text x="34" y="296" font-size="12.5">endpoint in docs/billing.md. Include query</text>
  <text x="34" y="315" font-size="12.5">params and an example curl.</text>

  <!-- thinking -->
  <text x="34" y="354" font-size="11.5" class="muted it">Checking the handler for the accepted query</text>
  <text x="34" y="371" font-size="11.5" class="muted it">params before writing docs…</text>

  <!-- tool execution -->
  <rect x="20" y="389" width="350" height="96" rx="8" class="card"/>
  <text x="34" y="411" font-size="10.5" class="mono green w7">edit  docs/billing.md</text>
  <text x="356" y="411" font-size="9.5" text-anchor="end" class="mono muted">+42 −1</text>
  <g class="mono green" font-size="9.5">
    <text x="34" y="433">+ ## Export as CSV</text>
    <text x="34" y="451">+ GET /billing/export.csv?month=2025-03</text>
    <text x="34" y="469">+ Returns text/csv; fields are RFC 4180</text>
  </g>

  <!-- assistant -->
  <rect x="20" y="505" width="350" height="96" rx="10" class="card"/>
  <text x="34" y="525" font-size="9" class="mono muted">14:25 · assistant</text>
  <text x="34" y="546" font-size="12.5">Documented the endpoint with query params,</text>
  <text x="34" y="565" font-size="12.5">auth notes, and a curl example. Marked the</text>
  <text x="34" y="584" font-size="12.5">reports flag as required.</text>

  <!-- tool execution 2 -->
  <rect x="20" y="621" width="350" height="60" rx="8" class="card"/>
  <text x="34" y="643" font-size="10.5" class="mono green w7">bash  npm run docs:lint</text>
  <text x="34" y="665" font-size="9.5" class="mono muted">✓ 0 problems in docs/billing.md</text>

  <!-- final assistant -->
  <rect x="20" y="697" width="350" height="56" rx="10" class="card"/>
  <text x="34" y="717" font-size="9" class="mono muted">14:26 · assistant</text>
  <text x="34" y="738" font-size="12.5">Done — docs/billing.md updated and linted.</text>

  <!-- footer -->
  <line x1="0" y1="776.5" x2="390" y2="776.5" class="hairline"/>
  <text x="195" y="800" font-size="10.5" text-anchor="middle" class="muted">Swipe down or tap ‹ to return to the invoking entry</text>
  <rect x="128" y="822" width="134" height="5" rx="2.5" fill="#202b26" opacity="0.85"/>
</svg>
