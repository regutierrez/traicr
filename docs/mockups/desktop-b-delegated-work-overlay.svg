<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Traicr — Concept B: delegated-work overlay with an agent switcher rail</title>
  <desc id="desc">The parent transcript stays dimmed underneath. One quiet summary row in the parent opens a centered sheet: a slim rail on the left lists the session's subagents with status, and the selected child transcript fills the rest. Escape returns to the parent. All transcript text is synthetic.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #202b26; }
    .mono { font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .muted { fill: #606d65; }
    .green { fill: #25583e; }
    .white { fill: #ffffff; }
    .it { font-style: italic; }
    .w5 { font-weight: 500; }
    .w6 { font-weight: 600; }
    .w7 { font-weight: 700; }
    .card { fill: #ffffff; stroke: #dce2d9; }
    .soft { fill: #eaf0e7; }
    .hairline { stroke: #dce2d9; }
  </style>
  <defs>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#101a14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ============ parent view underneath (dimmed by the scrim) ============ -->
  <rect width="1440" height="1000" fill="#f7f8f4"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="300" height="1000" fill="#ffffff"/>
  <line x1="300.5" y1="0" x2="300.5" y2="1000" class="hairline"/>
  <rect x="16" y="18" width="268" height="34" rx="6" fill="#f7f8f4" stroke="#dce2d9"/>
  <text x="30" y="40" font-size="13" class="muted">Search…</text>
  <g class="mono" font-size="11">
    <text x="16" y="90" class="muted">session · pi · 12 Mar 14:22</text>
    <text x="16" y="111">├ user  add CSV export to billing</text>
    <text x="16" y="132">├ assistant  plan the export flow</text>
    <text x="16" y="153" class="muted">│ ├ edit  report/export.go</text>
    <text x="16" y="174" class="green">│ └ ◆ delegated work (3)</text>
    <text x="16" y="195">├ assistant  wire export button</text>
    <text x="16" y="216" class="muted">│ └ bash  npm run typecheck</text>
    <text x="16" y="237">└ assistant  summary and handoff</text>
  </g>

  <!-- parent transcript -->
  <rect x="340" y="24" width="26" height="26" rx="5" fill="#25583e"/>
  <text x="353" y="43" font-size="17" text-anchor="middle" class="white" font-family="Georgia, serif" font-weight="700">t</text>
  <text x="374" y="43" font-size="16" class="w7" letter-spacing="-0.5">traicr</text>
  <text x="447" y="42" font-size="12.5" class="green">← Transcripts</text>
  <text x="1140" y="42" font-size="12.5" text-anchor="end" class="green">Session details &amp; source records</text>
  <line x1="340" y1="64.5" x2="1140" y2="64.5" class="hairline"/>

  <rect x="340" y="84" width="800" height="108" rx="12" class="card"/>
  <rect x="364" y="102" width="26" height="18" rx="4" class="soft"/>
  <text x="377" y="115" font-size="9.5" text-anchor="middle" class="mono green w7">PI</text>
  <text x="400" y="115" font-size="10" class="mono muted">e9c4a1b2 · 12 Mar 2025 · 14:22</text>
  <text x="364" y="146" font-size="21" font-weight="650" letter-spacing="-0.4">Add CSV export to billing reports</text>
  <text x="364" y="172" font-size="10.5" class="mono muted">cwd ~/code/lumen · claude-sonnet-4-5 · 42 events</text>

  <rect x="340" y="212" width="800" height="74" rx="10" class="soft"/>
  <text x="360" y="234" font-size="9.5" class="mono muted">14:22 · user</text>
  <text x="360" y="257" font-size="14">Add a CSV export button to the billing report page. Escape quoted</text>
  <text x="360" y="278" font-size="14">fields properly and cover it with tests.</text>

  <rect x="340" y="306" width="800" height="78" rx="10" class="card"/>
  <text x="360" y="328" font-size="9.5" class="mono muted">14:23 · assistant</text>
  <text x="360" y="351" font-size="14">I'll wire the endpoint and button here, and delegate the escaping test</text>
  <text x="360" y="372" font-size="14">matrix and the docs update to subagents so they land in parallel.</text>

  <!-- the quiet closed-state affordance: one summary row for all delegated work -->
  <rect x="340" y="404" width="800" height="44" rx="8" class="card"/>
  <text x="360" y="431" font-size="14" class="green w7">↳</text>
  <text x="380" y="430" font-size="13" class="w6">Delegated work · 3 agents</text>
  <text x="1092" y="430" font-size="10" text-anchor="end" class="mono muted">2 finished · 1 running</text>
  <text x="1108" y="431" font-size="14" class="green">›</text>

  <rect x="340" y="468" width="800" height="78" rx="10" class="card"/>
  <text x="360" y="490" font-size="9.5" class="mono muted">14:24 · assistant</text>
  <text x="360" y="513" font-size="14">Escaping tests are running in a subagent. Wiring the button while</text>
  <text x="360" y="534" font-size="14">that lands.</text>

  <rect x="340" y="566" width="800" height="96" rx="8" class="card"/>
  <text x="360" y="588" font-size="11.5" class="mono green w7">edit  internal/report/export.go</text>
  <text x="1120" y="588" font-size="10" text-anchor="end" class="mono muted">+64 −3</text>
  <g class="mono" font-size="10.5">
    <text x="360" y="610" class="green">+ func writeCSV(w io.Writer, rows []Row) error {</text>
    <text x="360" y="628" class="green">+     cw := csv.NewWriter(w)</text>
    <text x="360" y="646" class="muted">  … 61 more lines</text>
  </g>

  <rect x="340" y="682" width="800" height="78" rx="10" class="card"/>
  <text x="360" y="704" font-size="9.5" class="mono muted">14:31 · assistant</text>
  <text x="360" y="727" font-size="14">Export lands behind the reports flag. Docs and tests are linked</text>
  <text x="360" y="748" font-size="14">above as delegated work.</text>

  <!-- ============ scrim ============ -->
  <rect width="1440" height="1000" fill="#1c2420" opacity="0.38"/>

  <!-- ============ delegated-work sheet ============ -->
  <rect x="180" y="96" width="1080" height="808" rx="14" fill="#ffffff" filter="url(#sheetShadow)"/>

  <!-- sheet header: breadcrumb keeps the parent as context -->
  <text x="208" y="133" font-size="12.5" class="muted">Add CSV export to billing reports</text>
  <text x="420" y="133" font-size="12.5" class="muted">▸</text>
  <text x="436" y="133" font-size="12.5" class="green w6">Delegated work</text>
  <rect x="1146" y="114" width="34" height="22" rx="4" fill="#f7f8f4" stroke="#dce2d9"/>
  <text x="1163" y="129" font-size="9.5" text-anchor="middle" class="mono muted">esc</text>
  <rect x="1196" y="109" width="32" height="32" rx="6" fill="#ffffff" stroke="#dce2d9"/>
  <text x="1212" y="130" font-size="13" text-anchor="middle" class="muted">✕</text>
  <line x1="180" y1="156.5" x2="1260" y2="156.5" class="hairline"/>

  <!-- agent switcher rail -->
  <text x="208" y="186" font-size="10" letter-spacing="1.5" class="mono green w6">AGENTS</text>
  <text x="464" y="186" font-size="10" text-anchor="end" class="mono muted">by creation time</text>

  <!-- row 1: selected -->
  <rect x="192" y="204" width="280" height="64" rx="8" class="soft"/>
  <rect x="192" y="204" width="3" height="64" rx="1.5" fill="#25583e"/>
  <text x="212" y="231" font-size="13" class="w6">Unit tests for CSV escaping</text>
  <text x="212" y="253" font-size="10" class="mono muted">pi · finished · 3m 12s</text>
  <text x="452" y="232" font-size="12" text-anchor="end" class="green w7">✓</text>

  <!-- row 2: unread -->
  <text x="212" y="307" font-size="13" class="w5">API docs for export endpoint</text>
  <text x="212" y="329" font-size="10" class="mono muted">claude · finished · 1m 40s</text>
  <circle cx="448" cy="303" r="3.5" fill="#25583e"/>

  <!-- row 3: running -->
  <text x="212" y="383" font-size="13" class="w5">Investigate flaky pipeline timeout</text>
  <text x="212" y="405" font-size="10" class="mono muted">pi · running · 12m</text>
  <circle cx="448" cy="379" r="3.5" fill="none" stroke="#25583e" stroke-width="1.5"/>

  <line x1="488.5" y1="156" x2="488.5" y2="856" class="hairline"/>

  <!-- selected child transcript -->
  <text x="516" y="196" font-size="18" font-weight="650" letter-spacing="-0.3">Unit tests for CSV escaping</text>
  <text x="1232" y="195" font-size="11.5" text-anchor="end" class="green">Open standalone ↗</text>
  <text x="516" y="219" font-size="10.5" class="mono muted">pi · claude-sonnet-4-5 · ~/code/lumen · 14 events · ✓ finished</text>
  <line x1="516" y1="236.5" x2="1232" y2="236.5" class="hairline"/>

  <!-- delegation prompt -->
  <rect x="516" y="254" width="716" height="76" rx="8" class="soft"/>
  <text x="534" y="276" font-size="9" class="mono muted">14:23 · delegation prompt from parent</text>
  <text x="534" y="298" font-size="13">Write table-driven tests for the CSV escaping in internal/report.</text>
  <text x="534" y="318" font-size="13">Cover quotes, commas, newlines, and UTF-8. Don't touch export.go.</text>

  <!-- thinking -->
  <text x="534" y="356" font-size="12" class="muted it">Reading the current escaping rules before writing cases…</text>

  <!-- tool execution -->
  <rect x="516" y="374" width="716" height="112" rx="8" class="card"/>
  <text x="534" y="396" font-size="11" class="mono green w7">bash  go test ./internal/report -run Escape -v</text>
  <g class="mono" font-size="10">
    <text x="534" y="418" class="muted">=== RUN   TestEscapeQuotes</text>
    <text x="534" y="436">--- PASS: TestEscapeQuotes (0.02s)</text>
    <text x="534" y="454" class="muted">=== RUN   TestEscapeNewlines</text>
    <text x="534" y="472">--- PASS: TestEscapeNewlines (0.01s)</text>
  </g>

  <!-- assistant -->
  <rect x="516" y="504" width="716" height="76" rx="8" class="card"/>
  <text x="534" y="526" font-size="9" class="mono muted">14:26 · assistant</text>
  <text x="534" y="548" font-size="13">Added 12 cases in csv_escape_test.go. All pass after one fix:</text>
  <text x="534" y="568" font-size="13">quoteField now escapes bare carriage returns.</text>

  <!-- tool execution 2 -->
  <rect x="516" y="598" width="716" height="60" rx="8" class="card"/>
  <text x="534" y="620" font-size="11" class="mono green w7">edit  internal/report/csv_escape_test.go</text>
  <text x="1214" y="620" font-size="10" text-anchor="end" class="mono muted">+118 −0</text>
  <text x="534" y="642" font-size="10" class="mono green">+ {name: "crlf inside quotes", in: "a\r\nb", …}</text>

  <!-- final assistant -->
  <rect x="516" y="676" width="716" height="76" rx="8" class="card"/>
  <text x="534" y="698" font-size="9" class="mono muted">14:26 · assistant</text>
  <text x="534" y="720" font-size="13">Done. The escaping matrix is covered; go test ./internal/report</text>
  <text x="534" y="740" font-size="13">passes in 1.8s. Returning to the parent session.</text>

  <!-- nested delegated work, one level down -->
  <rect x="516" y="770" width="716" height="36" rx="8" class="card"/>
  <text x="534" y="793" font-size="12.5" class="green w7">↳</text>
  <text x="552" y="793" font-size="12" class="w5">Table formatting review</text>
  <text x="1198" y="793" font-size="9.5" text-anchor="end" class="mono muted">pi · finished</text>
  <text x="1212" y="794" font-size="13" class="green">›</text>

  <!-- sheet footer: keyboard model -->
  <line x1="180" y1="856.5" x2="1260" y2="856.5" class="hairline"/>
  <text x="720" y="884" font-size="10" text-anchor="middle" class="mono muted">↑ ↓ switch agent · esc return to parent · ↵ open standalone view</text>
</svg>
