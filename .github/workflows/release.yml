name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build collector
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date="$(git show -s --format=%cI HEAD)"
          go build -trimpath \
            -ldflags="-s -w -X github.com/regutierrez/traicr/internal/version.buildVersion=${VERSION} -X github.com/regutierrez/traicr/internal/version.buildCommit=${GITHUB_SHA} -X github.com/regutierrez/traicr/internal/version.buildDate=${build_date}" \
            -o "dist/traicr-${GOOS}-${GOARCH}" \
            ./cmd/traicr
      - uses: actions/upload-artifact@v4
        with:
          name: collector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/traicr-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: collector
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: collector-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cp compose.yaml dist/compose.yaml
          cd dist
          sha256sum compose.yaml traicr-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            dist/SHA256SUMS \
            dist/compose.yaml \
            dist/traicr-*

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish server image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/traicr-server
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI HEAD)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push \
            .
